<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Piket</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a1628; color: white; min-height: 100vh; }
    #admin-panel { display: none; background: #111; min-height: 100vh; padding: 1.5rem; }
    #display-panel { display: block; }

    .tv-wrap { padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; }
    .tv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .tv-logo { height: 86px; opacity: 0.9; filter: brightness(0) invert(1); }
    .tv-right { text-align: right; }
    .tv-clock { font-size: 56px; font-weight: 200; letter-spacing: 0.05em; }
    .tv-date { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .tv-divider { border: none; border-top: 0.5px solid rgba(255,255,255,0.1); margin-bottom: 1.5rem; }
    .tv-sesi-badge { display: inline-block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5DCAA5; margin-bottom: 0.5rem; }
    .tv-sesi-name { font-size: 32px; font-weight: 300; margin-bottom: 2px; }
    .tv-sesi-time { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 0.75rem; }
    .tv-piket-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 0.75rem; }
    .tv-hadits-wrap { border-top: 0.5px solid rgba(255,255,255,0.08); padding-top: 1.25rem; text-align: center; }
    .tv-hadits-text { font-size: 15px; font-style: italic; color: rgba(255,255,255,0.7); line-height: 1.6; transition: opacity 0.6s; }
    .tv-hadits-source { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 6px; letter-spacing: 0.05em; transition: opacity 0.6s; }
    .tv-countdown { margin-top: 0.75rem; font-size: 13px; color: rgba(255,255,255,0.3); text-align: center; }
    .tv-countdown span { color: #9FE1CB; font-weight: 500; }

    .idle-wrap { position: relative; min-height: 100vh; overflow: hidden; background: #0a1628; }
    .idle-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
    .idle-video.active { opacity: 1; }
    .idle-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .idle-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; text-align: center; }
    .idle-logo { height: 102px; opacity: 0.8; filter: brightness(0) invert(1); margin-bottom: 1.5rem; }
    .idle-clock { font-size: 80px; font-weight: 200; letter-spacing: 0.05em; }
    .idle-date { font-size: 16px; color: rgba(255,255,255,0.4); margin-top: 8px; }
    .idle-quote { margin-top: 2.5rem; max-width: 700px; }
    .idle-quote-text { font-size: 20px; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.85); font-style: italic; }
    .idle-quote-author { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 0.75rem; letter-spacing: 0.08em; }
    .idle-dots { display: flex; gap: 6px; margin-top: 2rem; justify-content: center; }
    .idle-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
    .idle-dot.active { background: #5DCAA5; }
    .idle-pesantren { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.15); white-space: nowrap; }

    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
    .admin-title { font-size: 18px; font-weight: 500; color: white; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .admin-tab { background: #222; border: 0.5px solid #444; color: #aaa; border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 14px; }
    .admin-tab.active { background: #1D9E75; border-color: #1D9E75; color: white; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .week-btn { background: #222; border: 0.5px solid #444; color: white; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    .week-label { font-size: 14px; color: #aaa; }
    .hari-block { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .hari-block.today { border-color: #1D9E75; }
    .hari-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .hari-badge { font-size: 11px; background: #1D9E75; color: white; border-radius: 6px; padding: 2px 8px; }
    .name-input { display: block; width: 100%; background: #111; border: 0.5px solid #333; border-radius: 8px; padding: 8px 12px; color: white; font-size: 14px; margin-bottom: 8px; font-family: inherit; }
    .save-btn { background: #1D9E75; border: none; color: white; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 0.5rem; }
    .status-msg { text-align: center; font-size: 13px; color: #5DCAA5; margin-top: 8px; min-height: 20px; }
    .toggle-btn { position: fixed; bottom: 1rem; right: 1rem; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; z-index: 99; }
    .content-block { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .content-block-title { font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
    .content-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
    .content-input { flex: 1; background: #111; border: 0.5px solid #333; border-radius: 8px; padding: 8px 12px; color: white; font-size: 13px; font-family: inherit; }
    .content-input-wide { width: 100%; background: #111; border: 0.5px solid #333; border-radius: 8px; padding: 8px 12px; color: white; font-size: 13px; font-family: inherit; margin-bottom: 8px; }
    .del-btn { background: #2a1a1a; border: 0.5px solid #553333; color: #ff6666; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; flex-shrink: 0; }
    .add-btn { background: #1a2a1a; border: 0.5px solid #335533; color: #66cc66; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; margin-top: 4px; }

    .konfirmasi-block { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .konfirmasi-sesi-title { font-size: 14px; font-weight: 500; color: #5DCAA5; margin-bottom: 1rem; letter-spacing: 0.05em; }
    .konfirmasi-name-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid #222; }
    .konfirmasi-name-row:last-child { border-bottom: none; }
    .konfirmasi-name { font-size: 14px; }
    .konfirmasi-name.selesai { color: #1D9E75; }
    .konfirmasi-name.telat { color: #ff4444; }
    .centang-btn { border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .centang-btn.belum { background: #222; color: #aaa; border: 0.5px solid #444; }
    .centang-btn.sudah { background: #1a2a1a; color: #1D9E75; border: 0.5px solid #1D9E75; }
  </style>
</head>
<body>

<button class="toggle-btn" onclick="toggleMode()">⚙️ Admin</button>

<div id="sound-overlay" style="position:fixed;inset:0;background:rgba(10,22,40,0.97);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;">
  <img src="https://qiicxgolluczqsjxvxhp.supabase.co/storage/v1/object/public/videos/logo%20aim%20putih.png.png" style="height:100px;filter:brightness(0) invert(1);opacity:0.9;" />
  <div style="font-size:18px;color:rgba(255,255,255,0.7);letter-spacing:0.05em;">Ma'had Tahfizh Al Qur'an Abdullah Ibnu Mas'ud</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.35);margin-top:0.5rem;">Sistem Jadwal Piket</div>
  <button onclick="activateSound()" style="margin-top:1rem;background:#1D9E75;border:none;color:white;border-radius:12px;padding:16px 40px;font-size:18px;cursor:pointer;letter-spacing:0.05em;">🔊 Aktifkan Suara</button>
</div>

<div id="display-panel" style="pointer-events:none;"></div>

<div id="admin-panel">
  <div class="admin-header">
    <div class="admin-title">Panel Admin</div>
    <div class="week-nav" id="week-nav">
      <button class="week-btn" onclick="changeWeek(-1)">&#8592;</button>
      <span class="week-label" id="admin-week-label"></span>
      <button class="week-btn" onclick="changeWeek(1)">&#8594;</button>
    </div>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchAdminTab('piket')">Jadwal Piket</button>
    <button class="admin-tab" onclick="switchAdminTab('konfirmasi')">Konfirmasi Piket</button>
    <button class="admin-tab" onclick="switchAdminTab('konten')">Konten Idle</button>
  </div>
  <div id="tab-piket">
    <div id="admin-hari-list"></div>
    <button class="save-btn" onclick="saveAll()">Simpan jadwal minggu ini</button>
    <div class="status-msg" id="status-msg"></div>
  </div>
  <div id="tab-konfirmasi" style="display:none;">
    <div id="konfirmasi-list"></div>
  </div>
  <div id="tab-konten" style="display:none;">
    <div class="content-block">
      <div class="content-block-title">Nasehat / Quotes</div>
      <div id="quotes-list"></div>
      <button class="add-btn" onclick="addQuote()">+ Tambah nasehat</button>
    </div>
    <div class="content-block">
      <div class="content-block-title">Video (Supabase Storage)</div>
      <div id="videos-list"></div>
      <button class="add-btn" onclick="addVideo()">+ Tambah video</button>
    </div>
    <button class="save-btn" onclick="saveKonten()">Simpan konten</button>
    <div class="status-msg" id="status-konten"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaWN4Z29sbHVjenFzanh2eGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTc1MTIsImV4cCI6MjA5MzQ5MzUxMn0.EBXJ_HtcDRgNO0rAxx5l196OyZgA2VdqTpu1ggpl03w';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const LOGO_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co/storage/v1/object/public/videos/logo%20aim%20putih.png.png';
  const ELEVENLABS_VOICE = 'ErXwobaYiN019PkySvjV';

  const HARI = [
    { id: 'senin',  nama: 'Senin' },
    { id: 'selasa', nama: 'Selasa' },
    { id: 'rabu',   nama: 'Rabu' },
    { id: 'kamis',  nama: 'Kamis' },
    { id: 'jumat',  nama: 'Jumat' },
    { id: 'sabtu',  nama: 'Sabtu' },
    { id: 'minggu', nama: 'Minggu' },
  ];

  const SESI = [
    { id: 'sarapan', nama: 'الإفطار', label: 'Sarapan pagi', mulai: 7*60,     selesai: 7*60+30,  pengumuman: 7*60-10 },
    { id: 'siang',   nama: 'الغداء',  label: 'Makan siang',  mulai: 12*60+30, selesai: 13*60+30, pengumuman: 12*60+20 },
    { id: 'malam',   nama: 'العشاء',  label: 'Makan malam',  mulai: 18*60,    selesai: 18*60+30, pengumuman: 17*60+50 },
  ];

  const SLOTS = 7;
  const BATAS_MENIT = 30;

  const HADITS = [
    { text: 'Kebersihan adalah sebagian dari iman.', source: 'HR. Muslim' },
    { text: 'Sesungguhnya Allah itu baik dan menyukai kebaikan, bersih dan menyukai kebersihan.', source: 'HR. Tirmidzi' },
    { text: 'Makanlah dengan tangan kananmu dan makanlah apa yang ada di hadapanmu.', source: 'HR. Bukhari & Muslim' },
    { text: 'Apabila salah seorang dari kalian makan, hendaknya ia menyebut nama Allah.', source: 'HR. Abu Dawud & Tirmidzi' },
    { text: 'Janganlah salah seorang dari kalian makan dan minum dengan tangan kirinya.', source: 'HR. Muslim' },
    { text: 'Berkah itu ada pada makanan yang dimakan bersama-sama.', source: 'HR. Abu Dawud' },
    { text: 'Cucilah tanganmu sebelum dan sesudah makan.', source: 'HR. Ibnu Majah' },
    { text: 'Janganlah kalian mencela makanan. Jika menyukainya, makanlah. Jika tidak, tinggalkanlah.', source: 'HR. Bukhari & Muslim' },
  ];

  const HARI_JS = ['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];

  let weekOffset = 0;
  let adminData = {};
  let isAdmin = false;
  let lastAnnouncedSesi = null;
  let cachedData = null;
  let statusData = {};
  let quotes = [];
  let videos = [];
  let idleIndex = 0;
  let idleTimer = null;
  let idleBuilt = false;
  let haditsIndex = 0;
  let haditsTimer = null;
  let nameSlideIndex = 0;
  let nameSlideTimer = null;
  let nameSlideList = [];

  function weekKey(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const y = d.getFullYear();
    const wn = Math.ceil(((d - new Date(y,0,1))/86400000 + 1)/7);
    return `${y}-W${String(wn).padStart(2,'0')}`;
  }

  function weekRangeLabel(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const end = new Date(d); end.setDate(d.getDate()+6);
    const fmt = x => x.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
    return `${fmt(d)} – ${fmt(end)}`;
  }

  function getTodayHari() { return HARI_JS[new Date().getDay()]; }

  function getNowMin() {
    const n = new Date();
    return n.getHours()*60 + n.getMinutes();
  }

  function getDisplaySesi() {
    const now = getNowMin();
    for (const s of SESI) {
      if (now >= s.pengumuman && now < s.selesai) return s;
    }
    return null;
  }

  function formatJam(min) {
    return `${String(Math.floor(min/60)).padStart(2,'0')}.${String(min%60).padStart(2,'0')}`;
  }

  function isLewatBatas(sesi) {
    return getNowMin() >= sesi.selesai - BATAS_MENIT;
  }

  function getStatusNama(sesiId, nama) {
    const key = `${sesiId}__${nama}`;
    return statusData[key] || false;
  }

  async function toggleStatus(sesiId, nama) {
    const key = weekKey(0);
    const hari = getTodayHari();
    const current = getStatusNama(sesiId, nama);
    const newVal = !current;
    statusData[`${sesiId}__${nama}`] = newVal;

    await sb.from('status_piket').upsert({
      week_key: key,
      hari,
      sesi_id: sesiId,
      nama,
      selesai: newVal
    }, { onConflict: 'week_key,hari,sesi_id,nama' });

    renderKonfirmasi();
  }

  async function loadDisplay() {
    const key = weekKey(0);
    const hari = getTodayHari();
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    cachedData = data;

    const { data: sd } = await sb.from('status_piket').select('*').eq('week_key', key).eq('hari', hari);
    statusData = {};
    if (sd) sd.forEach(r => { statusData[`${r.sesi_id}__${r.nama}`] = r.selesai; });

    const { data: kq } = await sb.from('jadwal_piket').select('*').eq('week_key', 'konten_idle').eq('sesi', 'quotes').maybeSingle();
    if (kq) { try { quotes = JSON.parse(kq.names); } catch(e) { quotes = []; } }
    const { data: kv } = await sb.from('jadwal_piket').select('*').eq('week_key', 'konten_idle').eq('sesi', 'videos').maybeSingle();
    if (kv) { try { videos = JSON.parse(kv.names); } catch(e) { videos = []; } }
  }

  async function announce(sesi, names) {
    const filtered = names.filter(n => n.trim());
    if (!filtered.length) return;
    const text = `انتبهوا جميعاً. حان الآن وقت ${sesi.nama}. الطلاب المكلفون بالنظافة هم: ${filtered.join('، ')}. يرجى التوجه فوراً إلى قاعة الطعام. جزاكم الله خيراً.`;
    try {
      const r = await fetch('/.netlify/functions/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: ELEVENLABS_VOICE })
      });
      const b = await r.blob();
      new Audio(URL.createObjectURL(b)).play();
    } catch(e) { console.error('TTS error:', e); }
  }

  function startHaditsRotation() {
    if (haditsTimer) clearInterval(haditsTimer);
    haditsIndex = 0;
    updateHadits();
    haditsTimer = setInterval(updateHadits, 5000);
  }

  function updateHadits() {
    const el = document.getElementById('tv-hadits-text');
    const src = document.getElementById('tv-hadits-source');
    if (!el || !src) return;
    const h = HADITS[haditsIndex % HADITS.length];
    el.style.opacity = 0; src.style.opacity = 0;
    setTimeout(() => {
      el.textContent = `"${h.text}"`;
      src.textContent = h.source;
      el.style.opacity = 1; src.style.opacity = 1;
    }, 300);
    haditsIndex++;
  }

  function startNameSlide(names) {
    if (nameSlideTimer) clearInterval(nameSlideTimer);
    nameSlideList = names;
    nameSlideIndex = 0;
    showNameSlide();
    nameSlideTimer = setInterval(showNameSlide, 3000);
  }

  function showNameSlide() {
    if (!nameSlideList.length) return;
    nameSlideIndex = nameSlideIndex % nameSlideList.length;
    const card = document.getElementById('tv-name-card');
    const numEl = document.getElementById('tv-name-num');
    const textEl = document.getElementById('tv-name-text');
    const dotsEl = document.getElementById('tv-name-dots');
    if (!card || !numEl || !textEl) return;

    const nama = nameSlideList[nameSlideIndex];
    const sesi = getDisplaySesi();
    const sudah = sesi ? getStatusNama(sesi.id, nama) : false;
    const telat = sesi ? isLewatBatas(sesi) && !sudah : false;

    card.style.opacity = 0;
    card.style.transform = 'translateY(10px)';
    setTimeout(() => {
      numEl.textContent = `SANTRI ${String(nameSlideIndex+1).padStart(2,'0')} / ${nameSlideList.length}`;
      numEl.style.color = sudah ? '#1D9E75' : telat ? '#ff4444' : 'rgba(255,255,255,0.3)';
      textEl.textContent = nama + (sudah ? ' ✓' : telat ? ' !' : '');
      textEl.style.color = sudah ? '#1D9E75' : telat ? '#ff4444' : 'white';
      card.style.opacity = 1;
      card.style.transform = 'translateY(0)';
    }, 300);

    if (dotsEl) {
      dotsEl.innerHTML = nameSlideList.map((_,i) => {
        const n = nameSlideList[i];
        const s = sesi ? getStatusNama(sesi.id, n) : false;
        const t = sesi ? isLewatBatas(sesi) && !s : false;
        const color = s ? '#1D9E75' : t ? '#ff4444' : 'rgba(255,255,255,0.2)';
        return `<div style="width:8px;height:8px;border-radius:50%;background:${i===nameSlideIndex?color:'rgba(255,255,255,0.15)'};transition:background 0.3s;outline:${i===nameSlideIndex?`2px solid ${color}`:'none'};outline-offset:2px;"></div>`;
      }).join('');
    }

    nameSlideIndex++;
  }

  function buildIdle() {
    const panel = document.getElementById('display-panel');
    panel.innerHTML = `
      <div class="idle-wrap">
        ${videos.map((v,i) => `<video class="idle-video" id="vid-${i}" src="${v.url}" muted playsinline></video>`).join('')}
        <div class="idle-overlay"></div>
        <div class="idle-content">
          <img class="idle-logo" src="${LOGO_URL}" alt="Logo" />
          <div class="idle-clock" id="idle-clock"></div>
          <div class="idle-date" id="idle-date"></div>
          <div class="idle-quote" id="idle-quote"></div>
          <div class="idle-dots" id="idle-dots"></div>
        </div>
        <div class="idle-pesantren">Ma'had Tahfizh Al Qur'an Abdullah Ibnu Mas'ud</div>
      </div>
    `;
    idleBuilt = true;
    idleIndex = 0;
    if (idleTimer) clearInterval(idleTimer);
    showIdleSlide();
    idleTimer = setInterval(showIdleSlide, 8000);
  }

  function showIdleSlide() {
    const allItems = [
      ...quotes.map(q => ({ type: 'quote', ...q })),
      ...videos.map(v => ({ type: 'video', ...v }))
    ];
    if (!allItems.length) return;
    idleIndex = idleIndex % allItems.length;
    const item = allItems[idleIndex];
    document.querySelectorAll('.idle-video').forEach((el, i) => {
      const isActive = item.type === 'video' && videos[i]?.url === item.url;
      el.classList.toggle('active', isActive);
      if (isActive) el.play().catch(()=>{});
      else { el.pause(); el.currentTime = 0; }
    });
    const qEl = document.getElementById('idle-quote');
    if (qEl) {
      qEl.innerHTML = item.type === 'quote' ? `
        <div class="idle-quote-text">"${item.text}"</div>
        ${item.author ? `<div class="idle-quote-author">— ${item.author}</div>` : ''}
      ` : '';
    }
    const dots = document.getElementById('idle-dots');
    if (dots) dots.innerHTML = allItems.map((_,i) => `<div class="idle-dot ${i===idleIndex?'active':''}"></div>`).join('');
    idleIndex++;
  }

  function updateIdleClock() {
    const now = new Date();
    const cl = document.getElementById('idle-clock');
    const dt = document.getElementById('idle-date');
    if (cl) cl.textContent = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    if (dt) dt.textContent = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }

  function renderDisplay() {
    const now = new Date();
    const nowMin = getNowMin();
    const timeStr = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const dateStr = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const sesi = getDisplaySesi();
    const panel = document.getElementById('display-panel');

    if (!sesi) {
      if (!idleBuilt) buildIdle();
      else updateIdleClock();
      return;
    }

    idleBuilt = false;
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }

    const todayHari = getTodayHari();
    const row = cachedData?.find(r => r.sesi === todayHari);
    const names = row ? JSON.parse(row.names) : [];
    const filtered = names.filter(n => n.trim());
    const isActive = nowMin >= sesi.mulai;
    const mnitLagi = sesi.mulai - nowMin;

    const needsRebuild = !document.getElementById('tv-hadits-text');
    if (needsRebuild) {
      panel.innerHTML = `
        <div class="tv-wrap">
          <div class="tv-top">
            <img class="tv-logo" src="${LOGO_URL}" alt="Logo" />
            <div class="tv-right">
              <div class="tv-clock" id="tv-clock">${timeStr}</div>
              <div class="tv-date" id="tv-date">${dateStr}</div>
            </div>
          </div>
          <hr class="tv-divider">
          <div class="tv-sesi-badge" id="tv-badge"></div>
          <div class="tv-sesi-name" id="tv-sesi-name"></div>
          <div class="tv-sesi-time" id="tv-sesi-time"></div>
          <div class="tv-piket-label">Santri bertugas piket hari ini</div>
          <div id="tv-name-slide" style="min-height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;">
            <div id="tv-name-card" style="text-align:center;transition:opacity 0.5s,transform 0.5s;">
              <div id="tv-name-num" style="font-size:12px;letter-spacing:0.1em;margin-bottom:8px;"></div>
              <div id="tv-name-text" style="font-size:52px;font-weight:300;letter-spacing:0.02em;"></div>
            </div>
          </div>
          <div id="tv-name-dots" style="display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem;"></div>
          <div class="tv-hadits-wrap">
            <div class="tv-hadits-text" id="tv-hadits-text"></div>
            <div class="tv-hadits-source" id="tv-hadits-source"></div>
          </div>
          <div class="tv-countdown" id="tv-countdown"></div>
        </div>
      `;
      startHaditsRotation();
      startNameSlide(filtered);
    }

    document.getElementById('tv-clock').textContent = timeStr;
    document.getElementById('tv-date').textContent = dateStr;
    document.getElementById('tv-badge').textContent = isActive ? 'Sedang berlangsung' : `${mnitLagi} menit lagi`;
    document.getElementById('tv-sesi-name').textContent = sesi.label;
    document.getElementById('tv-sesi-time').textContent = `${formatJam(sesi.mulai)} – ${formatJam(sesi.selesai)} WIB`;
    document.getElementById('tv-countdown').innerHTML = !isActive ? `Dimulai dalam <span>${mnitLagi} menit</span>` : '';

    if (isActive && sesi.id !== lastAnnouncedSesi && nowMin === sesi.mulai) {
      lastAnnouncedSesi = sesi.id;
      announce(sesi, names);
    }
  }

  async function renderKonfirmasi() {
    const key = weekKey(0);
    const hari = getTodayHari();
    const row = cachedData?.find(r => r.sesi === hari);
    const names = row ? JSON.parse(row.names).filter(n => n.trim()) : [];
    const nowMin = getNowMin();

    document.getElementById('konfirmasi-list').innerHTML = SESI.map(s => {
      const lewat = nowMin >= s.selesai - BATAS_MENIT;
      return `
        <div class="konfirmasi-block">
          <div class="konfirmasi-sesi-title">${s.label} · ${formatJam(s.mulai)} – ${formatJam(s.selesai)} WIB</div>
          ${names.length ? names.map(nama => {
            const sudah = getStatusNama(s.id, nama);
            const telat = lewat && !sudah;
            return `
              <div class="konfirmasi-name-row">
                <span class="konfirmasi-name ${sudah ? 'selesai' : telat ? 'telat' : ''}">${nama}${sudah ? ' ✓' : telat ? ' ⚠️' : ''}</span>
                <button class="centang-btn ${sudah ? 'sudah' : 'belum'}" onclick="toggleStatus('${s.id}', '${nama}')">
                  ${sudah ? '✓ Selesai' : 'Tandai Selesai'}
                </button>
              </div>
            `;
          }).join('') : '<div style="color:#555;font-size:13px;">Belum ada nama untuk hari ini.</div>'}
        </div>
      `;
    }).join('');
  }

  async function loadAdmin() {
    const key = weekKey(weekOffset);
    document.getElementById('admin-week-label').textContent = weekRangeLabel(weekOffset);
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    adminData = {};
    HARI.forEach(h => {
      const row = data?.find(r => r.sesi === h.id);
      adminData[h.id] = row ? JSON.parse(row.names) : Array(SLOTS).fill('');
    });
    renderAdmin();
  }

  function renderAdmin() {
    const todayHari = weekOffset === 0 ? getTodayHari() : '';
    document.getElementById('admin-hari-list').innerHTML = HARI.map(h => `
      <div class="hari-block ${h.id === todayHari ? 'today' : ''}">
        <div class="hari-title">
          ${h.nama}
          ${h.id === todayHari ? '<span class="hari-badge">Hari ini</span>' : ''}
        </div>
        <div style="margin-top:10px;">
          ${adminData[h.id].map((n,i) => `
            <input class="name-input" data-hari="${h.id}" data-idx="${i}" value="${n}" placeholder="Nama santri ${i+1}..." />
          `).join('')}
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.name-input').forEach(inp => {
      inp.addEventListener('input', e => {
        adminData[e.target.dataset.hari][+e.target.dataset.idx] = e.target.value;
      });
    });
  }

  function renderKonten() {
    document.getElementById('quotes-list').innerHTML = quotes.map((q,i) => `
      <div class="content-row">
        <div style="flex:1;">
          <input class="content-input-wide" placeholder="Teks nasehat..." value="${q.text||''}" oninput="quotes[${i}].text=this.value" />
          <input class="content-input-wide" placeholder="Sumber / penulis (opsional)" value="${q.author||''}" oninput="quotes[${i}].author=this.value" />
        </div>
        <button class="del-btn" onclick="quotes.splice(${i},1);renderKonten()">Hapus</button>
      </div>
    `).join('');
    document.getElementById('videos-list').innerHTML = videos.map((v,i) => `
      <div class="content-row">
        <input class="content-input" placeholder="URL Supabase Storage..." value="${v.url||''}" oninput="videos[${i}].url=this.value" />
        <button class="del-btn" onclick="videos.splice(${i},1);renderKonten()">Hapus</button>
      </div>
    `).join('');
  }

  function addQuote() { quotes.push({ text: '', author: '' }); renderKonten(); }
  function addVideo() { videos.push({ url: '' }); renderKonten(); }

  async function saveAll() {
    const key = weekKey(weekOffset);
    const msg = document.getElementById('status-msg');
    msg.textContent = 'Menyimpan...';
    for (const h of HARI) {
      await sb.from('jadwal_piket').upsert({ week_key: key, sesi: h.id, names: JSON.stringify(adminData[h.id]) }, { onConflict: 'week_key,sesi' });
    }
    msg.textContent = 'Tersimpan!';
    setTimeout(() => msg.textContent = '', 2000);
    await loadDisplay();
  }

  async function saveKonten() {
    const msg = document.getElementById('status-konten');
    msg.textContent = 'Menyimpan...';
    await sb.from('jadwal_piket').upsert({ week_key: 'konten_idle', sesi: 'quotes', names: JSON.stringify(quotes) }, { onConflict: 'week_key,sesi' });
    await sb.from('jadwal_piket').upsert({ week_key: 'konten_idle', sesi: 'videos', names: JSON.stringify(videos) }, { onConflict: 'week_key,sesi' });
    msg.textContent = 'Tersimpan!';
    setTimeout(() => msg.textContent = '', 2000);
    idleBuilt = false;
    await loadDisplay();
  }

  function switchAdminTab(tab) {
    document.querySelectorAll('.admin-tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0&&tab==='piket')||(i===1&&tab==='konfirmasi')||(i===2&&tab==='konten'));
    });
    document.getElementById('tab-piket').style.display = tab==='piket' ? 'block' : 'none';
    document.getElementById('tab-konfirmasi').style.display = tab==='konfirmasi' ? 'block' : 'none';
    document.getElementById('tab-konten').style.display = tab==='konten' ? 'block' : 'none';
    document.getElementById('week-nav').style.display = tab==='piket' ? 'flex' : 'none';
    if (tab==='piket') loadAdmin();
    if (tab==='konfirmasi') renderKonfirmasi();
    if (tab==='konten') renderKonten();
  }

  function changeWeek(dir) { weekOffset += dir; loadAdmin(); }

  function activateSound() {
    document.getElementById('sound-overlay').style.display = 'none';
    document.getElementById('display-panel').style.pointerEvents = 'auto';
  }

  function toggleMode() {
    isAdmin = !isAdmin;
    document.getElementById('display-panel').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
    document.querySelector('.toggle-btn').textContent = isAdmin ? '📺 Tampilan TV' : '⚙️ Admin';
    if (isAdmin) { idleBuilt = false; loadAdmin(); }
  }

  loadDisplay().then(() => {
    renderDisplay();
    setInterval(renderDisplay, 1000);
    setInterval(loadDisplay, 15000);
  });
</script>
</body>
</html>
