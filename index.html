<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Piket</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="display-panel"></div>

<script>
// ===== KODE ASLI + FIX AUDIO MINIMAL =====

const SUPABASE_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaWN4Z29sbHVjenFzanh2eGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTc1MTIsImV4cCI6MjA5MzQ5MzUxMn0.EBXJ_HtcDRgNO0rAxx5l196OyZgA2VdqTpu1ggpl03w';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SESI = [
  { id: 'sarapan', nama: 'Sarapan pagi', mulai: 420, selesai: 450, pengumuman: 410 },
  { id: 'siang', nama: 'Makan siang', mulai: 750, selesai: 810, pengumuman: 740 },
  { id: 'malam', nama: 'Makan malam', mulai: 1080, selesai: 1110, pengumuman: 1070 },
];

let cachedData = [];
let videos = [];
let quotes = [];
let idleIndex = 0;
let idleTimer = null;
let idleBuilt = false;
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  document.querySelectorAll('video').forEach(v => {
    v.muted = false;
    v.volume = 1;
    v.play().catch(()=>{});
  });
  audioUnlocked = true;
}
window.addEventListener('click', unlockAudio, { once: true });
window.addEventListener('touchstart', unlockAudio, { once: true });

function weekKey(offset=0) {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
  const y = d.getFullYear();
  const wn = Math.ceil(((d - new Date(y,0,1))/86400000 + 1)/7);
  return `${y}-W${String(wn).padStart(2,'0')}`;
}

function getNowMin() {
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function safeParse(json) {
  try { return JSON.parse(json) || []; }
  catch { return []; }
}

async function loadDisplay() {
  const key = weekKey(0);

  const { data } = await sb
    .from('jadwal_piket')
    .select('*')
    .eq('week_key', key);

  cachedData = data || [];

  const { data: kv } = await sb
    .from('jadwal_piket')
    .select('*')
    .eq('week_key','konten_idle')
    .eq('sesi','videos')
    .maybeSingle();

  const { data: kq } = await sb
    .from('jadwal_piket')
    .select('*')
    .eq('week_key','konten_idle')
    .eq('sesi','quotes')
    .maybeSingle();

  videos = kv ? safeParse(kv.names) : [];
  quotes = kq ? safeParse(kq.names) : [];
}

function buildIdle() {
  const panel = document.getElementById('display-panel');

  panel.innerHTML = `
    <div style="position:relative;height:100vh;overflow:hidden">
      ${videos.map((v,i)=>`<video id="vid-${i}" src="${v.url}" playsinline></video>`).join('')}
      <div id="quote" style="position:absolute;bottom:40px;width:100%;text-align:center;color:white"></div>
    </div>
  `;

  idleBuilt = true;
  idleIndex = 0;

  if (idleTimer) clearInterval(idleTimer);
  showIdleSlide();
  idleTimer = setInterval(showIdleSlide, 8000);

  setTimeout(unlockAudio, 1000);
}

function showIdleSlide() {
  const items = [
    ...videos.map(v=>({type:'video',...v})),
    ...quotes.map(q=>({type:'quote',...q}))
  ];

  if (!items.length) return;

  const item = items[idleIndex % items.length];

  document.querySelectorAll('video').forEach((el,i)=>{
    const isActive = item.type==='video' && videos[i]?.url===item.url;

    if (isActive) {
      el.style.display = 'block';
      el.muted = !audioUnlocked;
      el.play().catch(()=>{});
    } else {
      el.style.display = 'none';
      el.pause();
      el.currentTime = 0;
    }
  });

  const q = document.getElementById('quote');
  if (q) q.innerHTML = item.type==='quote' ? item.text : '';

  idleIndex++;
}

function renderDisplay() {
  const nowMin = getNowMin();
  const sesi = SESI.find(s => nowMin >= s.pengumuman && nowMin < s.selesai);

  if (!sesi) {
    if (!idleBuilt) buildIdle();
    return;
  }

  idleBuilt = false;
  if (idleTimer) clearInterval(idleTimer);

  const row = cachedData.find(r => r.sesi === sesi.id);
  const names = safeParse(row?.names);

  document.getElementById('display-panel').innerHTML = `
    <h1>${sesi.nama}</h1>
    ${names.length ? names.map(n=>`<div>${n}</div>`).join('') : '<div>Belum ada data</div>'}
  `;
}

loadDisplay().then(()=>{
  renderDisplay();
  setInterval(renderDisplay,1000);
  setInterval(loadDisplay,30000);
});
</script>

</body>
</html>
