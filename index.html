<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Piket</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a1628; color: white; }
    .idle-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1s; }
    .idle-video.active { opacity:1; }
  </style>
</head>
<body>

<div id="display-panel"></div>

<script>
const SUPABASE_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaWN4Z29sbHVjenFzanh2eGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTc1MTIsImV4cCI6MjA5MzQ5MzUxMn0.EBXJ_HtcDRgNO0rAxx5l196OyZgA2VdqTpu1ggpl03w
';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SESI = [
  { id: 'sarapan', nama: 'Sarapan pagi', mulai: 420, selesai: 450, pengumuman: 410 },
  { id: 'siang', nama: 'Makan siang', mulai: 750, selesai: 810, pengumuman: 740 },
  { id: 'malam', nama: 'Makan malam', mulai: 1080, selesai: 1110, pengumuman: 1070 },
];

let cachedData = [];
let videos = [];
let quotes = [];
let idleIndex = 0;
let idleTimer = null;
let idleBuilt = false;
let audioUnlocked = false;
let lastAnnouncedSesi = null;

function unlockAudio() {
  if (audioUnlocked) return;
  document.querySelectorAll('video').forEach(v => {
    v.muted = false;
    v.volume = 1;
    v.play().catch(()=>{});
  });
  audioUnlocked = true;
}

window.addEventListener('click', unlockAudio, { once: true });
window.addEventListener('touchstart', unlockAudio, { once: true });

function getNowMin() {
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function safeParse(json) {
  try { return JSON.parse(json) || []; }
  catch { return []; }
}

async function loadData() {
  const { data } = await sb.from('jadwal_piket').select('*');
  cachedData = data || [];

  const kv = cachedData.find(r => r.week_key === 'konten_idle' && r.sesi === 'videos');
  const kq = cachedData.find(r => r.week_key === 'konten_idle' && r.sesi === 'quotes');

  videos = kv ? safeParse(kv.names) : [];
  quotes = kq ? safeParse(kq.names) : [];
}

function buildIdle() {
  const panel = document.getElementById('display-panel');

  panel.innerHTML = `
    <div style="position:relative;height:100vh;overflow:hidden">
      ${videos.map((v,i)=>`<video class="idle-video" id="vid-${i}" src="${v.url}" playsinline loop></video>`).join('')}
      <div id="quote" style="position:absolute;bottom:50px;width:100%;text-align:center;font-size:22px"></div>
    </div>
  `;

  idleBuilt = true;
  idleIndex = 0;

  if (idleTimer) clearInterval(idleTimer);
  showIdleSlide();
  idleTimer = setInterval(showIdleSlide, 8000);

  setTimeout(()=>unlockAudio(),1000);
}

function showIdleSlide() {
  const items = [
    ...videos.map(v=>({type:'video',...v})),
    ...quotes.map(q=>({type:'quote',...q}))
  ];

  if (!items.length) return;

  const item = items[idleIndex % items.length];

  document.querySelectorAll('.idle-video').forEach((el,i)=>{
    const isActive = item.type==='video' && videos[i]?.url===item.url;
    el.classList.toggle('active', isActive);

    if (isActive) {
      el.muted = !audioUnlocked;
      el.play().catch(()=>{});
    } else {
      el.pause();
      el.currentTime = 0;
    }
  });

  const q = document.getElementById('quote');
  if (q) {
    q.innerHTML = item.type==='quote' ? `"${item.text}"` : '';
  }

  idleIndex++;
}

function render() {
  const nowMin = getNowMin();
  const sesi = SESI.find(s => nowMin >= s.pengumuman && nowMin < s.selesai);

  if (!sesi) {
    if (!idleBuilt) buildIdle();
    return;
  }

  idleBuilt = false;
  if (idleTimer) clearInterval(idleTimer);

  const row = cachedData.find(r => r.sesi === sesi.id);
  const names = safeParse(row?.names);

  document.getElementById('display-panel').innerHTML = `
    <h1>${sesi.nama}</h1>
    ${names.map(n=>`<div>${n}</div>`).join('')}
  `;

  if (nowMin >= sesi.mulai && sesi.id !== lastAnnouncedSesi) {
    lastAnnouncedSesi = sesi.id;
  }
}

// realtime
sb.channel('realtime')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal_piket' }, loadData)
  .subscribe();

// watchdog video
setInterval(()=>{
  document.querySelectorAll('video').forEach(v=>{
    if (v.paused) v.play().catch(()=>{});
  });
},5000);

loadData().then(()=>{
  render();
  setInterval(render,1000);
});
</script>

</body>
</html>
