    .konfirmasi-name.selesai { color: #1D9E75; }

<script>
  const SUPABASE_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaWN4Z29sbHVjenFzanh2eGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTc1MTIsImV4cCI6MjA5MzQ5MzUxMn0.EBXJ_HtcDRgNO0rAxx5l196OyZgA2VdqTpu1ggpl03w';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const LOGO_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co/storage/v1/object/public/videos/logo%20aim%20putih.png.png';
  const ELEVENLABS_VOICE = 'ErXwobaYiN019PkySvjV';

  const HARI = [
    { id: 'senin',  nama: 'Senin' },
    { id: 'selasa', nama: 'Selasa' },
    { id: 'rabu',   nama: 'Rabu' },
    { id: 'kamis',  nama: 'Kamis' },
    { id: 'jumat',  nama: 'Jumat' },
    { id: 'sabtu',  nama: 'Sabtu' },
    { id: 'minggu', nama: 'Minggu' },
  ];

  const SESI = [
    { id: 'sarapan', nama: 'الإفطار', label: 'Sarapan pagi', mulai: 7*60,     selesai: 7*60+30,  pengumuman: 7*60-10 },
    { id: 'siang',   nama: 'الغداء',  label: 'Makan siang',  mulai: 12*60+30, selesai: 13*60+30, pengumuman: 12*60+20 },
    { id: 'malam',   nama: 'العشاء',  label: 'Makan malam',  mulai: 18*60,    selesai: 18*60+30, pengumuman: 17*60+50 },
  ];

  const SLOTS = 7;
  const BATAS_MENIT = 30;

  const HADITS = [
    { text: 'Kebersihan adalah sebagian dari iman.', source: 'HR. Muslim' },
    { text: 'Sesungguhnya Allah itu baik dan menyukai kebaikan, bersih dan menyukai kebersihan.', source: 'HR. Tirmidzi' },
    { text: 'Makanlah dengan tangan kananmu dan makanlah apa yang ada di hadapanmu.', source: 'HR. Bukhari & Muslim' },
    { text: 'Apabila salah seorang dari kalian makan, hendaknya ia menyebut nama Allah.', source: 'HR. Abu Dawud & Tirmidzi' },
    { text: 'Janganlah salah seorang dari kalian makan dan minum dengan tangan kirinya.', source: 'HR. Muslim' },
    { text: 'Berkah itu ada pada makanan yang dimakan bersama-sama.', source: 'HR. Abu Dawud' },
    { text: 'Cucilah tanganmu sebelum dan sesudah makan.', source: 'HR. Ibnu Majah' },
    { text: 'Janganlah kalian mencela makanan. Jika menyukainya, makanlah. Jika tidak, tinggalkanlah.', source: 'HR. Bukhari & Muslim' },
  ];

  const LAT = -6.3741;
  const LNG = 106.8958;
  const IQOMAH_MENIT = 10;

  const SHOLAT_NAMES = {
    Fajr: 'Subuh', Dhuhr: 'Dzuhur', Asr: 'Ashar', Maghrib: 'Maghrib', Isha: 'Isya'
  };

  const SHOLAT_BG = {
    Fajr:    'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?w=1920&q=80',
    Dhuhr:   'https://images.unsplash.com/photo-1564769625905-50e93615e769?w=1920&q=80',
    Asr:     'https://images.unsplash.com/photo-1564769625905-50e93615e769?w=1920&q=80',
    Maghrib: 'https://images.unsplash.com/photo-1519817914152-22d216bb9170?w=1920&q=80',
    Isha:    'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?w=1920&q=80',
  };

  const HADITS_SHOLAT = [
    { text: 'Sholat adalah tiang agama. Barangsiapa mendirikannya, maka ia telah menegakkan agama.', source: 'HR. Baihaqi' },
    { text: 'Amalan yang pertama kali dihisab dari seorang hamba pada hari kiamat adalah sholatnya.', source: 'HR. Abu Dawud' },
    { text: 'Jagalah sholat-sholat kalian, khususnya sholat wustha (Ashar).', source: 'QS. Al-Baqarah: 238' },
    { text: 'Sesungguhnya sholat itu mencegah dari perbuatan keji dan mungkar.', source: 'QS. Al-Ankabut: 45' },
    { text: 'Bersegeralah kalian menuju sholat sebelum datang tujuh perkara.', source: 'HR. Muslim' },
    { text: 'Sholat berjemaah lebih utama 27 derajat daripada sholat sendirian.', source: 'HR. Bukhari & Muslim' },
  ];

  const HARI_JS = ['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];

  let weekOffset = 0;
  let adminData = {};
  let isAdmin = false;
  let lastAnnouncedSesi = null;
  let cachedData = null;
  let statusData = {};
  let quotes = [];
  let videos = [];
  let idleIndex = 0;
  let idleTimer = null;
  let idleBuilt = false;
  let haditsIndex = 0;
  let haditsTimer = null;
  let jadwalSholat = null;
  let sholatHaditsIndex = 0;
  let sholatHaditsTimer = null;
  let videoJedaMode = false;
  let videoJedaTimer = null;

  function weekKey(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const y = d.getFullYear();
    const wn = Math.ceil(((d - new Date(y,0,1))/86400000 + 1)/7);
    return `${y}-W${String(wn).padStart(2,'0')}`;
  }

  function weekRangeLabel(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const end = new Date(d); end.setDate(d.getDate()+6);
    const fmt = x => x.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
    return `${fmt(d)} – ${fmt(end)}`;
  }

  function getTodayHari() { return HARI_JS[new Date().getDay()]; }
  function getNowMin() { const n = new Date(); return n.getHours()*60 + n.getMinutes(); }

  function getDisplaySesi() {
    const now = getNowMin();
    for (const s of SESI) {
      if (now >= s.pengumuman && now < s.selesai) return s;
    }
    return null;
  }

  function formatJam(min) {
    return `${String(Math.floor(min/60)).padStart(2,'0')}.${String(min%60).padStart(2,'0')}`;
  }

  function isLewatBatas(sesi) { return getNowMin() >= sesi.selesai - BATAS_MENIT; }
  function getStatusNama(sesiId, nama) { return statusData[`${sesiId}__${nama}`] || false; }

  async function toggleStatus(sesiId, nama) {
    const key = weekKey(0);
    const hari = getTodayHari();
    const newVal = !getStatusNama(sesiId, nama);
    statusData[`${sesiId}__${nama}`] = newVal;
    await sb.from('status_piket').upsert({
      week_key: key, hari, sesi_id: sesiId, nama, selesai: newVal
    }, { onConflict: 'week_key,hari,sesi_id,nama' });
    renderKonfirmasi();
  }

  async function loadJadwalSholat() {
    try {
      const today = new Date();
      const d = today.getDate(), m = today.getMonth()+1, y = today.getFullYear();
      const res = await fetch(`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${LAT}&longitude=${LNG}&method=11`);
      const json = await res.json();
      jadwalSholat = json.data.timings;
    } catch(e) { console.error('Gagal load jadwal sholat:', e); }
  }

  function getActiveSholat() {
    if (!jadwalSholat) return null;
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    for (const key of ['Fajr','Dhuhr','Asr','Maghrib','Isha']) {
      const [h, mn] = jadwalSholat[key].split(':').map(Number);
      const sholatMin = h*60 + mn;
      const preMin = sholatMin - 5;
      const iqomahMin = sholatMin + IQOMAH_MENIT;
      if (nowMin >= preMin && nowMin < iqomahMin) {
        const phase = nowMin < sholatMin ? 'pre' : 'iqomah';
        const countdown = phase === 'pre' ? sholatMin - nowMin : iqomahMin - nowMin;
        return { key, phase, countdown, sholatMin, iqomahMin };
      }
    }
    return null;
  }

  function renderSholatDisplay(active) {
    const panel = document.getElementById('display-panel');
    const bg = SHOLAT_BG[active.key];
    const nama = SHOLAT_NAMES[active.key];
    const now = new Date();
    const timeStr = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const isPre = active.phase === 'pre';
    const badgeText = isPre ? `${active.countdown} menit menuju adzan` : `Iqomah dalam ${active.countdown} menit`;
    const titleText = isPre ? `Bersiap untuk sholat ${nama}` : `Sholat ${nama}`;
    const nowSec = now.getSeconds();
    const totalSec = active.countdown * 60 - nowSec;
    const mm = String(Math.floor(totalSec / 60)).padStart(2,'0');
    const ss = String(totalSec % 60).padStart(2,'0');
    const hadits = HADITS_SHOLAT[sholatHaditsIndex % HADITS_SHOLAT.length];

    const needsRebuild = !document.getElementById('sholat-panel');
    if (needsRebuild) {
      if (haditsTimer) clearInterval(haditsTimer);
      if (idleTimer) clearInterval(idleTimer);
      idleBuilt = false;
      panel.innerHTML = `
        <div id="sholat-panel" style="position:relative;min-height:100vh;overflow:hidden;background:#0a1020;">
          <img id="sholat-bg" src="${bg}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;transition:opacity 1s;" />
          <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.7));"></div>
          <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;">
            <div style="font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:1rem;" id="sholat-time">${timeStr}</div>
            <div id="sholat-badge" style="font-size:13px;background:rgba(255,255,255,0.12);border:0.5px solid rgba(255,255,255,0.2);border-radius:20px;padding:6px 18px;color:rgba(255,255,255,0.8);margin-bottom:1.5rem;">${badgeText}</div>
            <div id="sholat-title" style="font-size:48px;font-weight:200;color:white;letter-spacing:0.03em;margin-bottom:0.5rem;">${titleText}</div>
            <div id="sholat-countdown" style="font-size:72px;font-weight:100;color:#9FE1CB;letter-spacing:0.05em;margin-bottom:2rem;">${mm}:${ss}</div>
            <div style="max-width:600px;border-top:0.5px solid rgba(255,255,255,0.15);padding-top:1.5rem;">
              <div id="sholat-hadits" style="font-size:18px;font-style:italic;color:rgba(255,255,255,0.8);line-height:1.7;transition:opacity 0.3s;">"${hadits.text}"</div>
              <div id="sholat-source" style="font-size:13px;color:rgba(255,255,255,0.4);margin-top:8px;transition:opacity 0.3s;">${hadits.source}</div>
            </div>
          </div>
        </div>
      `;
      sholatHaditsTimer = setInterval(() => {
        sholatHaditsIndex++;
        const h = HADITS_SHOLAT[sholatHaditsIndex % HADITS_SHOLAT.length];
        const el = document.getElementById('sholat-hadits');
        const src = document.getElementById('sholat-source');
        if (el) { el.style.opacity=0; setTimeout(()=>{ el.textContent=`"${h.text}"`; el.style.opacity=1; },300); }
        if (src) { src.style.opacity=0; setTimeout(()=>{ src.textContent=h.source; src.style.opacity=1; },300); }
      }, 6000);
    } else {
      document.getElementById('sholat-time').textContent = timeStr;
      document.getElementById('sholat-badge').textContent = badgeText;
      document.getElementById('sholat-title').textContent = titleText;
      document.getElementById('sholat-countdown').textContent = `${mm}:${ss}`;
      document.getElementById('sholat-bg').src = bg;
    }
  }

  async function loadDisplay() {
    const key = weekKey(0);
    const hari = getTodayHari();
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    cachedData = data;
    const { data: sd } = await sb.from('status_piket').select('*').eq('week_key', key).eq('hari', hari);
    statusData = {};
    if (sd) sd.forEach(r => { statusData[`${r.sesi_id}__${r.nama}`] = r.selesai; });
    const { data: kq } = await sb.from('jadwal_piket').select('*').eq('week_key', 'konten_idle').eq('sesi', 'quotes').maybeSingle();
    if (kq) { try { quotes = JSON.parse(kq.names); } catch(e) { quotes = []; } }
    const { data: kv } = await sb.from('jadwal_piket').select('*').eq('week_key', 'konten_idle').eq('sesi', 'videos').maybeSingle();
    if (kv) { try { videos = JSON.parse(kv.names); } catch(e) { videos = []; } }
  }

  async function announce(sesi, names) {
    const filtered = names.filter(n => n.trim());
    if (!filtered.length) return;
    const text = `انتبهوا جميعاً. حان الآن وقت ${sesi.nama}. الطلاب المكلفون بالنظافة هم: ${filtered.join('، ')}. يرجى التوجه فوراً إلى قاعة الطعام. جزاكم الله خيراً.`;
    try {
      const r = await fetch('/.netlify/functions/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: ELEVENLABS_VOICE })
      });
      const b = await r.blob();
      new Audio(URL.createObjectURL(b)).play();
    } catch(e) { console.error('TTS error:', e); }
  }

  function startHaditsRotation() {
    if (haditsTimer) clearInterval(haditsTimer);
    haditsIndex = 0;
    updateHadits();
    haditsTimer = setInterval(updateHadits, 5000);
  }

  function updateHadits() {
    const el = document.getElementById('tv-hadits-text');
    const src = document.getElementById('tv-hadits-source');
    if (!el || !src) return;
    const h = HADITS[haditsIndex % HADITS.length];
    el.style.opacity = 0; src.style.opacity = 0;
    setTimeout(() => {
      el.textContent = `"${h.text}"`;
      src.textContent = h.source;
      el.style.opacity = 1; src.style.opacity = 1;
    }, 300);
    haditsIndex++;
  }

  function buildIdle() {
    const panel = document.getElementById('display-panel');
    panel.innerHTML = `
      <div class="idle-wrap">
        ${videos.map((v,i) => `<video class="idle-video" id="vid-${i}" src="${v.url}" playsinline></video>`).join('')}
        <div class="idle-overlay"></div>
        <div class="idle-content">
          <img class="idle-logo" src="${LOGO_URL}" alt="Logo" />
          <div class="idle-clock" id="idle-clock"></div>
          <div class="idle-date" id="idle-date"></div>
          <div class="idle-quote" id="idle-quote"></div>
          <div class="idle-dots" id="idle-dots"></div>
        </div>
        <div class="idle-pesantren">Ma'had Tahfizh Al Qur'an Abdullah Ibnu Mas'ud</div>
      </div>
    `;
    idleBuilt = true;
    idleIndex = 0;
    videoJedaMode = false;
    if (idleTimer) clearInterval(idleTimer);
    function showIdleSlide() {
    if (videoJedaMode) return;

    const allVideos = videos;
    const allQuotes = quotes;
    if (!allVideos.length && !allQuotes.length) return;

    // Semua video sudah diputar, masuk mode jeda
    if (idleIndex >= allVideos.length + allQuotes.length && allVideos.length > 0) {
      videoJedaMode = true;
      document.querySelectorAll('.idle-video').forEach(el => {
        el.classList.remove('active'); el.pause(); el.currentTime = 0;
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'flex';
      if (overlay) overlay.style.opacity = '1';
      if (videoJedaTimer) clearTimeout(videoJedaTimer);
      videoJedaTimer = setTimeout(() => {
        videoJedaMode = false;
        idleIndex = 0;
        showIdleSlide();
      }, 5 * 60 * 1000);
      return;
    }

    if (idleIndex < allVideos.length) {
      const v = allVideos[idleIndex];
      document.querySelectorAll('.idle-video').forEach((el, i) => {
        const active = i === idleIndex;
        el.classList.toggle('active', active);
        if (active) { el.muted = false; el.play().catch(()=>{}); }
        else { el.pause(); el.currentTime = 0; }
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'none';
      if (overlay) overlay.style.opacity = '0';
      idleIndex++;
    } else if (allQuotes.length) {
      document.querySelectorAll('.idle-video').forEach(el => {
        el.classList.remove('active'); el.pause(); el.currentTime = 0;
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'flex';
      if (overlay) overlay.style.opacity = '1';
      const qi = (idleIndex - allVideos.length) % allQuotes.length;
      const q = allQuotes[qi];
      const qEl = document.getElementById('idle-quote');
      if (qEl) qEl.innerHTML = `<div class="idle-quote-text">"${q.text}"</div>${q.author ? `<div class="idle-quote-author">— ${q.author}</div>` : ''}`;
      idleIndex++;
    } else {
      idleIndex = 0;
      videoJedaMode = true;
      if (videoJedaTimer) clearTimeout(videoJedaTimer);
      videoJedaTimer = setTimeout(() => {
        videoJedaMode = false;
        idleIndex = 0;
        showIdleSlide();
      }, 5 * 60 * 1000);
    }
  };
    idleTimer = setInterval(() => {
      const activeVid = document.querySelector('.idle-video.active');
      if (!activeVid || activeVid.ended || activeVid.paused) {
        showIdleSlide();
      }
    }, 1000);
  }

  function showIdleSlide() {
    if (videoJedaMode) return;

    const allVideos = videos;
    const allQuotes = quotes;

    if (!allVideos.length && !allQuotes.length) return;

    const videosDone = idleIndex >= allVideos.length && allVideos.length > 0;

    if (videosDone) {
      videoJedaMode = true;
      document.querySelectorAll('.idle-video').forEach(el => {
        el.classList.remove('active');
        el.pause();
        el.currentTime = 0;
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'flex';
      if (overlay) overlay.style.opacity = '1';

      if (videoJedaTimer) clearTimeout(videoJedaTimer);
      videoJedaTimer = setTimeout(() => {
        videoJedaMode = false;
        idleIndex = 0;
        showIdleSlide();
      }, 5 * 60 * 1000);
      return;
    }

    if (idleIndex < allVideos.length) {
      const v = allVideos[idleIndex];
      document.querySelectorAll('.idle-video').forEach((el, i) => {
        const active = allVideos[i]?.url === v.url;
        el.classList.toggle('active', active);
        if (active) { el.muted = false; el.play().catch(()=>{}); }
        else { el.pause(); el.currentTime = 0; }
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'none';
      if (overlay) overlay.style.opacity = '0';
      idleIndex++;
    } else if (allQuotes.length) {
      document.querySelectorAll('.idle-video').forEach(el => {
        el.classList.remove('active'); el.pause(); el.currentTime = 0;
      });
      const content = document.getElementById('idle-content');
      const overlay = document.querySelector('.idle-overlay');
      if (content) content.style.display = 'flex';
      if (overlay) overlay.style.opacity = '1';
      const qi = (idleIndex - allVideos.length) % allQuotes.length;
      const q = allQuotes[qi];
      const qEl = document.getElementById('idle-quote');
      if (qEl) qEl.innerHTML = `<div class="idle-quote-text">"${q.text}"</div>${q.author ? `<div class="idle-quote-author">— ${q.author}</div>` : ''}`;
      idleIndex++;
    }
  }

  function updateIdleClock() {
    const now = new Date();
    const cl = document.getElementById('idle-clock');
    const dt = document.getElementById('idle-date');
    const content = document.getElementById('idle-content');
    const isVideoActive = document.querySelector('.idle-video.active');
    if (content && !videoJedaMode) content.style.display = isVideoActive ? 'none' : 'flex';
    if (cl) cl.textContent = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    if (dt) dt.textContent = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }

  function renderDisplay() {
    const activeSholat = getActiveSholat();
    if (activeSholat) {
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
      if (haditsTimer) { clearInterval(haditsTimer); haditsTimer = null; }
      idleBuilt = false;
      renderSholatDisplay(activeSholat);
      return;
    }

    const sholatPanel = document.getElementById('sholat-panel');
    if (sholatPanel) {
      if (sholatHaditsTimer) { clearInterval(sholatHaditsTimer); sholatHaditsTimer = null; }
      idleBuilt = false;
    }

    const now = new Date();
    const nowMin = getNowMin();
    const timeStr = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const dateStr = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const sesi = getDisplaySesi();
    const panel = document.getElementById('display-panel');

    if (!sesi) {
      if (!idleBuilt) buildIdle();
      else updateIdleClock();
      return;
    }

    idleBuilt = false;
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }

    const todayHari = getTodayHari();
    const row = cachedData?.find(r => r.sesi === todayHari);
    const names = row ? JSON.parse(row.names) : [];
    const filtered = names.filter(n => n.trim());
    const isActive = nowMin >= sesi.mulai;
    const mnitLagi = sesi.mulai - nowMin;

    const needsRebuild = !document.getElementById('tv-hadits-text');
    if (needsRebuild) {
      panel.innerHTML = `
        <div class="tv-wrap">
          <div class="tv-top">
            <img class="tv-logo" src="${LOGO_URL}" alt="Logo" />
            <div class="tv-right">
              <div class="tv-clock" id="tv-clock">${timeStr}</div>
              <div class="tv-date" id="tv-date">${dateStr}</div>
            </div>
          </div>
          <hr class="tv-divider">
          <div class="tv-sesi-badge" id="tv-badge"></div>
          <div class="tv-sesi-name" id="tv-sesi-name"></div>
          <div class="tv-sesi-time" id="tv-sesi-time"></div>
          <div class="tv-piket-label">Santri bertugas piket hari ini</div>
          <div class="tv-names-grid" id="tv-names-grid"></div>
          <div class="tv-hadits-wrap">
            <div class="tv-hadits-text" id="tv-hadits-text"></div>
            <div class="tv-hadits-source" id="tv-hadits-source"></div>
          </div>
          <div class="tv-countdown" id="tv-countdown"></div>
        </div>
      `;
      startHaditsRotation();
    }

    document.getElementById('tv-clock').textContent = timeStr;
    document.getElementById('tv-date').textContent = dateStr;
    document.getElementById('tv-badge').textContent = isActive ? 'Sedang berlangsung' : `${mnitLagi} menit lagi`;
    document.getElementById('tv-sesi-name').textContent = sesi.label;
    document.getElementById('tv-sesi-time').textContent = `${formatJam(sesi.mulai)} – ${formatJam(sesi.selesai)} WIB`;
    document.getElementById('tv-names-grid').innerHTML = filtered.length
      ? filtered.map((n,i) => {
          const sudah = getStatusNama(sesi.id, n);
          const telat = isLewatBatas(sesi) && !sudah;
          return `
            <div class="tv-name-chip" style="${sudah ? 'border-color:#1D9E75;background:rgba(29,158,117,0.1);' : telat ? 'border-color:#ff4444;background:rgba(255,68,68,0.1);' : ''}">
              <div class="tv-name-num" style="${sudah ? 'color:#1D9E75;' : telat ? 'color:#ff4444;' : ''}">${sudah ? '✓ SELESAI' : telat ? '⚠ BELUM PIKET' : `SANTRI ${String(i+1).padStart(2,'0')}`}</div>
              <div class="tv-name-text" style="${sudah ? 'color:#1D9E75;' : telat ? 'color:#ff4444;' : ''}">${n}</div>
            </div>
          `;
        }).join('')
      : '<div style="color:rgba(255,255,255,0.3)">Belum ada nama untuk hari ini.</div>';
    document.getElementById('tv-countdown').innerHTML = !isActive ? `Dimulai dalam <span>${mnitLagi} menit</span>` : '';

    if (isActive && sesi.id !== lastAnnouncedSesi && nowMin === sesi.mulai) {
      lastAnnouncedSesi = sesi.id;
      announce(sesi, names);
    }
  }

  async function renderKonfirmasi() {
    const hari = getTodayHari();
    const row = cachedData?.find(r => r.sesi === hari);
    const names = row ? JSON.parse(row.names).filter(n => n.trim()) : [];
    const nowMin = getNowMin();
    document.getElementById('konfirmasi-list').innerHTML = SESI.map(s => {
      const lewat = nowMin >= s.selesai - BATAS_MENIT;
      return `
        <div class="konfirmasi-block">
          <div class="konfirmasi-sesi-title">${s.label} · ${formatJam(s.mulai)} – ${formatJam(s.selesai)} WIB</div>
          ${names.length ? names.map(nama => {
            const sudah = getStatusNama(s.id, nama);
            const telat = lewat && !sudah;
            return `
              <div class="konfirmasi-name-row">
                <span class="konfirmasi-name ${sudah ? 'selesai' : telat ? 'telat' : ''}">${nama}${sudah ? ' ✓' : telat ? ' ⚠️' : ''}</span>
                <button class="centang-btn ${sudah ? 'sudah' : 'belum'}" onclick="toggleStatus('${s.id}', '${nama}')">
                  ${sudah ? '✓ Selesai' : 'Tandai Selesai'}
                </button>
              </div>
            `;
          }).join('') : '<div style="color:#555;font-size:13px;">Belum ada nama untuk hari ini.</div>'}
        </div>
      `;
    }).join('');
  }

  async function loadAdmin() {
    const key = weekKey(weekOffset);
    document.getElementById('admin-week-label').textContent = weekRangeLabel(weekOffset);
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    adminData = {};
    HARI.forEach(h => {
      const row = data?.find(r => r.sesi === h.id);
      adminData[h.id] = row ? JSON.parse(row.names) : Array(SLOTS).fill('');
    });
    renderAdmin();
  }

  function renderAdmin() {
    const todayHari = weekOffset === 0 ? getTodayHari() : '';
    document.getElementById('admin-hari-list').innerHTML = HARI.map(h => `
      <div class="hari-block ${h.id === todayHari ? 'today' : ''}">
        <div class="hari-title">
          ${h.nama}
          ${h.id === todayHari ? '<span class="hari-badge">Hari ini</span>' : ''}
        </div>
        <div style="margin-top:10px;">
          ${adminData[h.id].map((n,i) => `
            <input class="name-input" data-hari="${h.id}" data-idx="${i}" value="${n}" placeholder="Nama santri ${i+1}..." />
          `).join('')}
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.name-input').forEach(inp => {
      inp.addEventListener('input', e => {
        adminData[e.target.dataset.hari][+e.target.dataset.idx] = e.target.value;
      });
    });
  }

  function renderKonten() {
    document.getElementById('quotes-list').innerHTML = quotes.map((q,i) => `
      <div class="content-row">
        <div style="flex:1;">
          <input class="content-input-wide" placeholder="Teks nasehat..." value="${q.text||''}" oninput="quotes[${i}].text=this.value" />
          <input class="content-input-wide" placeholder="Sumber / penulis (opsional)" value="${q.author||''}" oninput="quotes[${i}].author=this.value" />
        </div>
        <button class="del-btn" onclick="quotes.splice(${i},1);renderKonten()">Hapus</button>
      </div>
    `).join('');
    document.getElementById('videos-list').innerHTML = videos.map((v,i) => `
      <div class="content-row">
        <input class="content-input" placeholder="URL Supabase Storage..." value="${v.url||''}" oninput="videos[${i}].url=this.value" />
        <button class="del-btn" onclick="videos.splice(${i},1);renderKonten()">Hapus</button>
      </div>
    `).join('');
  }

  function addQuote() { quotes.push({ text: '', author: '' }); renderKonten(); }
  function addVideo() { videos.push({ url: '' }); renderKonten(); }

  async function saveAll() {
    const key = weekKey(weekOffset);
    const msg = document.getElementById('status-msg');
    msg.textContent = 'Menyimpan...';
    for (const h of HARI) {
      await sb.from('jadwal_piket').upsert({ week_key: key, sesi: h.id, names: JSON.stringify(adminData[h.id]) }, { onConflict: 'week_key,sesi' });
    }
    msg.textContent = 'Tersimpan!';
    setTimeout(() => msg.textContent = '', 2000);
    await loadDisplay();
  }

  async function saveKonten() {
    const msg = document.getElementById('status-konten');
    msg.textContent = 'Menyimpan...';
    await sb.from('jadwal_piket').upsert({ week_key: 'konten_idle', sesi: 'quotes', names: JSON.stringify(quotes) }, { onConflict: 'week_key,sesi' });
    await sb.from('jadwal_piket').upsert({ week_key: 'konten_idle', sesi: 'videos', names: JSON.stringify(videos) }, { onConflict: 'week_key,sesi' });
    msg.textContent = 'Tersimpan!';
    setTimeout(() => msg.textContent = '', 2000);
    idleBuilt = false;
    await loadDisplay();
  }

  function switchAdminTab(tab) {
    document.querySelectorAll('.admin-tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0&&tab==='piket')||(i===1&&tab==='konfirmasi')||(i===2&&tab==='konten'));
    });
    document.getElementById('tab-piket').style.display = tab==='piket' ? 'block' : 'none';
    document.getElementById('tab-konfirmasi').style.display = tab==='konfirmasi' ? 'block' : 'none';
    document.getElementById('tab-konten').style.display = tab==='konten' ? 'block' : 'none';
    document.getElementById('week-nav').style.display = tab==='piket' ? 'flex' : 'none';
    if (tab==='piket') loadAdmin();
    if (tab==='konfirmasi') renderKonfirmasi();
    if (tab==='konten') renderKonten();
  }

  function changeWeek(dir) { weekOffset += dir; loadAdmin(); }

  function activateSound() {
    document.getElementById('sound-overlay').style.display = 'none';
    document.getElementById('display-panel').style.pointerEvents = 'auto';
    document.querySelectorAll('.idle-video').forEach(v => { v.muted = false; });
  }

  function toggleMode() {
    isAdmin = !isAdmin;
    document.getElementById('display-panel').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
    document.querySelector('.toggle-btn').textContent = isAdmin ? '📺 Tampilan TV' : '⚙️ Admin';
    if (isAdmin) { idleBuilt = false; loadAdmin(); }
  }

  loadDisplay().then(() => {
    loadJadwalSholat();
    renderDisplay();
    setInterval(renderDisplay, 1000);
    setInterval(loadDisplay, 15000);
    setInterval(loadJadwalSholat, 60*60*1000);
  });
</script>
</body>
</html>
