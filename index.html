<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Piket</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a1628; color: white; min-height: 100vh; }

    #admin-panel { display: none; background: #111; min-height: 100vh; padding: 1.5rem; }
    #display-panel { display: block; }

    /* DISPLAY */
    .tv-wrap { padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; }
    .tv-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
    .tv-label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .tv-clock { font-size: 48px; font-weight: 300; letter-spacing: 0.05em; }
    .tv-date { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: right; }
    .tv-sesi-badge { display: inline-block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5DCAA5; margin-bottom: 0.5rem; }
    .tv-sesi-name { font-size: 36px; font-weight: 300; margin-bottom: 4px; }
    .tv-sesi-time { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 1.5rem; }
    .tv-names-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .tv-name-chip { background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 16px; }
    .tv-name-num { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; margin-bottom: 4px; }
    .tv-name-text { font-size: 15px; font-weight: 500; }
    .tv-countdown { margin-top: auto; padding-top: 2rem; font-size: 13px; color: rgba(255,255,255,0.3); }
    .tv-countdown span { color: #9FE1CB; font-weight: 500; }
    .tv-divider { border: none; border-top: 0.5px solid rgba(255,255,255,0.1); margin: 1.5rem 0; }

    /* ADMIN */
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .admin-title { font-size: 18px; font-weight: 500; color: white; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .week-btn { background: #222; border: 0.5px solid #444; color: white; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    .week-label { font-size: 14px; color: #aaa; }
    .sesi-block { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .sesi-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .sesi-time-label { font-size: 12px; color: #666; margin-bottom: 1rem; }
    .name-input { display: block; width: 100%; background: #111; border: 0.5px solid #333; border-radius: 8px; padding: 8px 12px; color: white; font-size: 14px; margin-bottom: 8px; font-family: inherit; }
    .save-btn { background: #1D9E75; border: none; color: white; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 0.5rem; }
    .save-btn:active { opacity: 0.8; }
    .status-msg { text-align: center; font-size: 13px; color: #5DCAA5; margin-top: 8px; min-height: 20px; }
    .toggle-btn { position: fixed; bottom: 1rem; right: 1rem; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; z-index: 99; }
  </style>
</head>
<body>

<button class="toggle-btn" onclick="toggleMode()">⚙️ Admin</button>

<!-- TAMPILAN TV -->
<div id="display-panel">
  <div class="tv-wrap">
    <div class="tv-top">
      <div>
        <div class="tv-label">Pesantren — Jadwal Piket</div>
      </div>
      <div>
        <div class="tv-clock" id="tv-clock">00:00:00</div>
        <div class="tv-date" id="tv-date"></div>
      </div>
    </div>
    <hr class="tv-divider">
    <div id="tv-content"></div>
    <div class="tv-countdown" id="tv-countdown"></div>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="admin-panel">
  <div class="admin-header">
    <div class="admin-title">Edit Jadwal Piket</div>
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeek(-1)">&#8592;</button>
      <span class="week-label" id="admin-week-label"></span>
      <button class="week-btn" onclick="changeWeek(1)">&#8594;</button>
    </div>
  </div>
  <div id="admin-sesi-list"></div>
  <button class="save-btn" onclick="saveAll()">Simpan jadwal minggu ini</button>
  <div class="status-msg" id="status-msg"></div>
</div>

<script>
  const SUPABASE_URL = 'https://qiicxgolluczqsjxvxhp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpaWN4Z29sbHVjenFzanh2eGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTc1MTIsImV4cCI6MjA5MzQ5MzUxMn0.EBXJ_HtcDRgNO0rAxx5l196OyZgA2VdqTpu1ggpl03w                ';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const SESI = [
    { id: 'sarapan', nama: 'Sarapan pagi', jam: '07:00', jamNum: 7*60 },
    { id: 'siang',   nama: 'Makan siang',  jam: '12:30', jamNum: 12*60+30 },
    { id: 'malam',   nama: 'Makan malam',  jam: '18:00', jamNum: 18*60 },
  ];
  const SLOTS = 8;

  let weekOffset = 0;
  let adminData = {};
  let isAdmin = false;

  function weekKey(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const y = d.getFullYear();
    const wn = Math.ceil(((d - new Date(y,0,1))/86400000 + 1)/7);
    return `${y}-W${String(wn).padStart(2,'0')}`;
  }

  function weekRangeLabel(offset=0) {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
    const end = new Date(d); end.setDate(d.getDate()+6);
    const fmt = x => x.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
    return `${fmt(d)} – ${fmt(end)}`;
  }

  function getNowMin() {
    const n = new Date();
    return n.getHours()*60 + n.getMinutes();
  }

  function getActiveSesi() {
    const now = getNowMin();
    let upcoming = null;
    for (const s of SESI) {
      if (now >= s.jamNum && now < s.jamNum+60) return { sesi: s, status: 'now' };
      if (now < s.jamNum && !upcoming) upcoming = s;
    }
    if (upcoming) return { sesi: upcoming, status: 'upcoming' };
    return null;
  }

  function formatCountdown(jamNum) {
    const now = getNowMin();
    let diff = jamNum - now;
    if (diff < 0) diff += 24*60;
    const h = Math.floor(diff/60);
    const m = diff%60;
    return h > 0 ? `${h} jam ${m} menit` : `${m} menit`;
  }

  async function loadDisplay() {
    const key = weekKey(0);
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    const now = getActiveSesi();

    if (!now) {
      document.getElementById('tv-content').innerHTML = `<div style="color:rgba(255,255,255,0.3);font-size:18px;margin-top:2rem;">Tidak ada jadwal piket aktif saat ini.</div>`;
      document.getElementById('tv-countdown').innerHTML = '';
      return;
    }

    const row = data?.find(r => r.sesi === now.sesi.id);
    const names = row ? JSON.parse(row.names) : [];
    const filtered = names.filter(n => n.trim());

    document.getElementById('tv-content').innerHTML = `
      <div class="tv-sesi-badge">${now.status === 'now' ? 'Sedang berlangsung' : 'Piket berikutnya'}</div>
      <div class="tv-sesi-name">${now.sesi.nama}</div>
      <div class="tv-sesi-time">${now.sesi.jam} WIB</div>
      <div class="tv-names-grid">
        ${filtered.length ? filtered.map((n,i) => `
          <div class="tv-name-chip">
            <div class="tv-name-num">SANTRI ${String(i+1).padStart(2,'0')}</div>
            <div class="tv-name-text">${n}</div>
          </div>
        `).join('') : '<div style="color:rgba(255,255,255,0.3)">Belum ada nama untuk sesi ini.</div>'}
      </div>
    `;

    document.getElementById('tv-countdown').innerHTML = now.status === 'upcoming'
      ? `Dimulai dalam <span>${formatCountdown(now.sesi.jamNum)}</span>`
      : `Sesi berlangsung hingga <span>${now.sesi.jam.split(':')[0]}:${String(parseInt(now.sesi.jam.split(':')[1])+60).padStart(2,'0')} WIB</span>`;
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('tv-clock').textContent = now.toLocaleTimeString('id-ID');
    document.getElementById('tv-date').textContent = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }

  async function loadAdmin() {
    const key = weekKey(weekOffset);
    document.getElementById('admin-week-label').textContent = weekRangeLabel(weekOffset);
    const { data } = await sb.from('jadwal_piket').select('*').eq('week_key', key);
    adminData = {};
    SESI.forEach(s => {
      const row = data?.find(r => r.sesi === s.id);
      adminData[s.id] = row ? JSON.parse(row.names) : Array(SLOTS).fill('');
    });
    renderAdmin();
  }

  function renderAdmin() {
    const container = document.getElementById('admin-sesi-list');
    container.innerHTML = SESI.map(s => `
      <div class="sesi-block">
        <div class="sesi-title">${s.nama}</div>
        <div class="sesi-time-label">${s.jam} WIB</div>
        ${adminData[s.id].map((n,i) => `
          <input class="name-input" data-sesi="${s.id}" data-idx="${i}" value="${n}" placeholder="Nama santri ${i+1}..." />
        `).join('')}
      </div>
    `).join('');

    document.querySelectorAll('.name-input').forEach(inp => {
      inp.addEventListener('input', e => {
        adminData[e.target.dataset.sesi][+e.target.dataset.idx] = e.target.value;
      });
    });
  }

  async function saveAll() {
    const key = weekKey(weekOffset);
    const msg = document.getElementById('status-msg');
    msg.textContent = 'Menyimpan...';
    for (const s of SESI) {
      const names = JSON.stringify(adminData[s.id]);
      await sb.from('jadwal_piket').upsert({ week_key: key, sesi: s.id, names }, { onConflict: 'week_key,sesi' });
    }
    msg.textContent = 'Tersimpan!';
    setTimeout(() => msg.textContent = '', 2000);
  }

  function changeWeek(dir) {
    weekOffset += dir;
    loadAdmin();
  }

  function toggleMode() {
    isAdmin = !isAdmin;
    document.getElementById('display-panel').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';
    document.querySelector('.toggle-btn').textContent = isAdmin ? '📺 Tampilan TV' : '⚙️ Admin';
    if (isAdmin) loadAdmin();
  }

  updateClock();
  setInterval(updateClock, 1000);
  loadDisplay();
  setInterval(loadDisplay, 10000);
</script>
</body>
</html>
